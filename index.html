<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHI Passport</title>
<meta name="description" content="Make a little block figure of yourself, find the people you came to meet at CHI 2027, and collect stamps in your conference passport.">
<meta name="theme-color" content="#284370">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CHI Passport">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column; the passport booklet is the home screen, every other view is a single scrolling sheet. */
:root {
  --navy: #284370;
  --navy-deep: #1D3257;
  --gold: #F4B02F;
  --coral: #EF6567;
  --coral-ink: #C2403F;
  --gold-ink: #A86F06;
  --ground: #EDF0F5;
  --paper: #FBF8F1;
  --card: #FFFFFF;
  --ink: #15171C;
  --muted: #4A505B;
  --line: #D6DCE6;
  --tint-gold: #FDEBC4;
  --on-navy: #D6DEEA;
  --display: 'Space Grotesk', 'Avenir Next', 'Segoe UI', sans-serif;
  --body: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--navy); }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; }
.screen { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px; padding-block: 12px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px 0 0; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; background: none; border: 0; }
.step { font-size: 13px; font-weight: 600; color: var(--muted); }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.h1 { font-size: 28px; line-height: 1.1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 18px; border-radius: 16px; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); font-weight: 700; font-size: 16px; text-decoration: none; text-align: center; }
.btn.gold { background: var(--gold); border-color: var(--gold); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
.btn.quiet { border-color: var(--line); font-weight: 600; font-size: 15px; min-height: 46px; }
.btn.ghost { border-color: transparent; background: transparent; font-weight: 600; min-height: 44px; }
.btn[disabled] { opacity: 0.4; cursor: default; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 8px; background: var(--tint-gold); color: var(--ink); }
.chip.plain { background: #E4E8EF; }
.chip.demo { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 600; padding: 2px 6px; font-size: 11px; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: #2E8B57; display: inline-block; }
.pill { min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid var(--ink); background: var(--card); font-weight: 600; font-size: 14px; }
.pill[aria-pressed="true"], .pill.on { background: var(--ink); color: #FFFFFF; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .legend { font-size: 13px; font-weight: 600; }
.input { min-height: 48px; border-radius: 12px; border: 1.5px solid #C9CFDA; background: var(--card); padding: 0 12px; font-size: 16px; width: 100%; }
textarea.input { padding: 10px 12px; resize: none; line-height: 1.4; }
.input:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(40,67,112,0.18); }
.error { color: var(--coral-ink); font-size: 13px; font-weight: 600; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; }
.check { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-size: 15px; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--navy); flex-shrink: 0; }
.fig { display: block; }

/* passport home */
.home { overflow: hidden; }
.home-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.stage { position: relative; padding: 18px 0 8px; }
.book { position: relative; width: min(300px, 100%); aspect-ratio: 300 / 430; margin: 0 auto; perspective: 1600px; touch-action: pan-y; }
.leaf { position: absolute; inset: 0; transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px 14px 14px 6px; transition: transform 0.9s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0s linear 0s; }
.leaf.flipped { transform: rotateY(-180deg); opacity: 0; pointer-events: none; transition: transform 0.9s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.2s linear 0.65s; }
.book.instant .leaf { transition: none !important; }
.cover { position: absolute; inset: 0; width: 100%; border: 0; padding: 0; border-radius: inherit; background: var(--navy); box-shadow: 0 18px 32px rgba(20,30,60,0.28); text-align: center; color: #FFFFFF; }
.cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; border-radius: 6px 0 0 6px; background: rgba(0,0,0,0.18); }
.cover::after { content: ""; position: absolute; inset: 10px 10px 10px 22px; border: 1.5px dashed rgba(244,176,47,0.55); border-radius: 8px; }
.cover-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 12% 8% 9% 11%; }
.cover-t1 { font-family: var(--display); font-weight: 700; color: var(--gold); letter-spacing: 0.22em; font-size: 15px; }
.cover-t2 { font-family: var(--display); font-weight: 700; color: var(--gold); letter-spacing: 0.18em; font-size: 26px; margin-top: 2px; }
.cover-logo { width: 72%; margin-top: 10%; }
.cover-rule { width: 40px; height: 1.5px; background: rgba(244,176,47,0.6); margin-top: 7%; }
.cover-date { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; margin-top: 6%; }
.cover-cta { font-size: 12px; color: var(--on-navy); margin-top: 8px; }
.paper { position: absolute; inset: 0; border-radius: inherit; background-color: var(--paper); background-image: repeating-linear-gradient(135deg, rgba(40,67,112,0.045) 0 1px, transparent 1px 7px); box-shadow: 0 14px 28px rgba(20,30,60,0.16); padding: 16px 16px 14px 22px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.paper::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; border-radius: 6px 0 0 6px; background: rgba(40,67,112,0.08); }
.pg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pg-head img { height: 26px; }
.pg-title { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--navy); }
.pg-num { font-size: 10px; font-weight: 600; color: #6A6F79; }
.id-row { display: flex; gap: 12px; }
.photo { width: 100px; height: 134px; flex-shrink: 0; border-radius: 6px; background: #E6E0D2; border: 1px solid #CFC6B3; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.fields { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fields dt, .grid2 dt { font-size: 9px; letter-spacing: 0.08em; color: #5F6470; text-transform: uppercase; }
.fields dd, .grid2 dd { margin: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.fields dd.big { font-size: 14px; font-weight: 700; text-transform: uppercase; }
.grid2 { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; }
.grid2 dd { font-size: 12px; }
.link-btn { background: none; border: 0; padding: 0; min-height: 32px; text-align: left; color: var(--navy); font-weight: 600; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.mrz { margin-top: auto; font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; line-height: 1.5; color: #2A2F3A; border-top: 1px solid #DDD5C4; padding-top: 8px; white-space: nowrap; overflow: hidden; }
.stamps { position: relative; flex: 1; }
.stamp { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; opacity: 0.9; color: var(--ink-c); border: 3px solid var(--ink-c); line-height: 1.15; }
.stamp b { font-family: var(--display); font-size: 14px; letter-spacing: 0.08em; }
.stamp span { font-size: 8.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; max-width: 100%; }
.stamp.round { width: 96px; height: 96px; border-radius: 50%; }
.stamp.round::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1.5px dashed var(--ink-c); }
.stamp.rect { padding: 7px 10px; border-style: double; border-width: 4px; max-width: 64%; }
.stamp.oval { width: 116px; max-width: 64%; height: 62px; border-radius: 50%; }
.stamp.next { border: 2px dashed #BDB4A2; color: #6A6F79; border-radius: 10px; width: 44%; height: 20% !important; height: 52px; font-size: 12px; font-weight: 600; opacity: 1; }
.pg-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); gap: 8px; }
.controls { display: flex; flex-direction: column; gap: 12px; }
.pager { display: flex; align-items: center; justify-content: space-between; }
.round-btn { width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; }
.round-btn[disabled] { opacity: 0.35; cursor: default; }
.badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--coral); color: var(--ink); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

/* builder */
.fig-stage { position: relative; height: 262px; display: flex; align-items: flex-end; justify-content: center; }
.fig-stage::before { content: ""; position: absolute; bottom: 6px; left: 50%; width: 220px; height: 220px; margin-left: -110px; border-radius: 50%; background: #DCE3EE; }
.fig-stage .fig { position: relative; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #DCE3EE; border-radius: 14px; }
.seg button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 2px rgba(20,30,60,0.12); }
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: 1; min-width: 60px; min-height: 46px; border: 0; background: none; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -3px 0 var(--gold); }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { width: 44px; height: 44px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px rgba(21,23,28,0.18); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--ink); }
.snap { width: 44px; height: 44px; border-radius: 12px; border: 1.5px dashed var(--ink); display: flex; align-items: center; justify-content: center; background: var(--card); cursor: pointer; overflow: hidden; background-size: cover; background-position: center; }
.snap.on { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--ink); border-style: solid; }
.snap:focus-within { outline: 3px solid var(--navy); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* details */
.moods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mood { position: relative; display: flex; flex-direction: column; gap: 2px; min-height: 64px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; }
.mood input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.mood b { font-size: 14px; }
.mood span { font-size: 12px; color: var(--muted); }
.mood:has(input:checked) { border-color: var(--ink); background: var(--tint-gold); }
.mood:has(input:focus-visible) { outline: 3px solid var(--navy); outline-offset: 2px; }
.pin { letter-spacing: 0.6em; font-family: var(--mono); font-size: 22px; max-width: 180px; text-align: center; }

/* people */
.search { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--ink); }
.search input { flex: 1; border: 0; outline: none; background: transparent; font-size: 16px; min-width: 0; min-height: 46px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.person { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.person .thumb { width: 64px; height: 86px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; flex-shrink: 0; }
.person .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.person .name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.person .topic { font-size: 13px; color: var(--muted); }
.ghost-card { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; border: 1.5px dashed #AEB6C4; }
.ghost-card .ph { width: 44px; height: 44px; border-radius: 12px; background: #DCE3EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--muted); }
.mini-btn { min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--ink); background: var(--gold); font-weight: 700; font-size: 13px; flex-shrink: 0; }
.mini-btn.done { background: var(--ink); color: #FFFFFF; }
.hero { margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-top: -12px; height: 270px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.hero .here { position: absolute; right: 16px; top: 14px; background: var(--card); border-radius: 10px; padding: 6px 10px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.hero .back { position: absolute; left: 12px; top: 10px; background: var(--card); border-radius: 22px; width: 44px; justify-content: center; padding: 0; }
.ok-line { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #2E7049; }

/* chat */
.thread { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.msg { max-width: 82%; padding: 10px 14px; font-size: 14px; line-height: 1.4; }
.msg.me { align-self: flex-end; background: var(--ink); color: #FFFFFF; border-radius: 18px 18px 4px 18px; }
.msg.them { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 18px 18px 18px 4px; }
.msg .lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 4px; }
.msg.me .lbl { color: var(--gold); }
.msg.them .lbl { color: var(--coral-ink); }
.sys { align-self: center; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #2E7049; background: #E3F1E8; padding: 6px 12px; border-radius: 12px; text-align: center; }
.quest { border-radius: 20px; background: var(--navy); color: #FFFFFF; overflow: hidden; }
.quest-top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
.quest-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.quest-body p { margin: 0; }
.quest-q { font-family: var(--display); font-size: 19px; line-height: 1.3; font-weight: 600; }
.quest .btn.line { background: transparent; border-color: #FFFFFF; color: #FFFFFF; }
.composer { display: flex; gap: 8px; align-items: center; position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--ground); }
.composer input { flex: 1; min-height: 46px; border-radius: 23px; border: 1.5px solid #C9CFDA; padding: 0 16px; background: var(--card); min-width: 0; font-size: 16px; }
.send { width: 46px; height: 46px; border-radius: 23px; border: 0; background: var(--ink); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.inbox-row { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.head-sq { display: inline-block; width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }

/* stamped + keepsake */
.navy-screen { background: var(--navy); color: #FFFFFF; }
body.navy-bg { background: var(--navy); }
.stamp-pad { position: relative; height: 300px; border-radius: 6px 14px 14px 6px; background-color: var(--paper); background-image: repeating-linear-gradient(135deg, rgba(40,67,112,0.045) 0 1px, transparent 1px 7px); color: var(--ink); overflow: hidden; }
.big-stamp { position: absolute; left: 50%; top: 50%; width: 230px; margin: -60px 0 0 -115px; border: 4px double var(--coral-ink); color: var(--coral-ink); padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; transform: scale(2.2) rotate(-4deg); opacity: 0; transition: transform 420ms cubic-bezier(0.2, 1.6, 0.4, 1), opacity 160ms linear; }
.big-stamp.landed { transform: scale(1) rotate(-4deg); opacity: 0.92; }
.big-stamp b { font-family: var(--display); font-size: 26px; letter-spacing: 0.08em; }
.big-stamp span { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.mini-cover { position: relative; width: 132px; height: 186px; border-radius: 4px 10px 10px 4px; background: var(--navy); box-shadow: 0 10px 20px rgba(20,30,60,0.22); flex-shrink: 0; overflow: hidden; }
.mini-cover img { position: absolute; left: 20%; top: 25%; width: 70%; }
.mini-cover .arch { position: absolute; left: 4px; right: 4px; top: 58%; text-align: center; transform: rotate(-14deg); border: 3px solid var(--coral); color: var(--coral); font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.1em; padding: 3px 0; background: rgba(29,50,87,0.7); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.log-day { margin: 0 0 4px; font-family: var(--display); font-size: 16px; }
.log { list-style: none; margin: 0; padding: 0; }
.log-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid #E6E9EF; }
.log-item:first-child { border-top: 0; }
.log-time { width: 40px; flex-shrink: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; font-variant-numeric: tabular-nums; }
.log-dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
.log-item .mo-ic { width: 34px; height: 34px; }
.card-sheet { position: absolute; left: -10000px; top: 0; width: 360px; height: 480px; box-sizing: border-box; padding: 22px 22px 24px; background: var(--navy); color: #FFFFFF; font: 15px/1.45 var(--body); display: flex; flex-direction: column; gap: 12px; border-radius: 0; }
.card-sheet::after { content: ""; position: absolute; inset: 9px; border: 1.5px dashed rgba(244,176,47,0.6); border-radius: 12px; pointer-events: none; }
.cs-top { display: flex; align-items: center; gap: 14px; }
.cs-logo { width: 92px; }
.cs-title { display: flex; flex-direction: column; }
.cs-t1 { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.22em; color: var(--gold); }
.cs-t2 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.16em; color: var(--gold); line-height: 1.1; }
.cs-date { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; margin-top: 4px; }
.cs-paper { background-color: var(--paper); color: var(--ink); border-radius: 6px 12px 12px 6px; padding: 12px 12px 10px 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.cs-id { display: flex; gap: 12px; }
.cs-stats { display: flex; gap: 22px; border-top: 1px solid #DDD5C4; padding-top: 8px; }
.cs-stats b { font-family: var(--display); font-size: 18px; display: block; line-height: 1.1; }
.cs-stats span { font-size: 10px; color: var(--muted); }
.cs-stamps { display: flex; flex-wrap: nowrap; gap: 8px; padding: 4px 0 4px; overflow: hidden; }

  function paperHits() {

    var hits = PAPERS.filter(function (p) { return have.indexOf(p.id) < 0 && (p.id + ' ' + p.title).toLowerCase().indexOf(q) >= 0; });
    if (!hits.length) return '<p class="small muted" style="margin:0">No paper matches “' + esc(dState.pq) + '”. Check the ID in the programme.</p>';
    return hits.map(function (p) { return '<button type="button" class="paper-hit" data-act="paperPick" data-id="' + p.id + '"><b>' + esc(p.title) + '</b><span>' + p.id + ' · ' + p.track + ' · ' + esc(p.authors.join(', ')) + '</span></button>'; }).join('');

    },
    reset: function () {
      $('#resetZone').innerHTML = '<p class="small" style="margin:0 0 8px">This deletes your passport and stamps from this phone.</p><div class="row2"><button type="button" class="btn quiet" data-act="resetNo">Keep it</button><button type="button" class="btn" style="border-color:var(--coral-ink);color:var(--coral-ink)" data-act="resetYes">Delete</button></div>';
    },
    resetNo: function () { rerender(); },
    resetYes: function () { store = fresh(); save(); draft = null; pIdx = 0; query = ''; go('passport'); }
  };
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var fn = ACT[b.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(b, e); }
  });
  app.addEventListener('change', function (e) {
    var inp = e.target.closest('[data-file]');
    if (!inp || !inp.files || !inp.files[0]) return;
    var k = inp.getAttribute('data-file');
    buildErr = '';
    squareFromFile(inp.files[0], k === 'photo' ? 160 : 96).then(function (url) {
      draft[k] = url;
      if (k === 'photo') draft.face = 'photo';
      if (k === 'topImg') draft.topTex = null;
      if (k === 'bottomImg') draft.bottomTex = null;
      rerender();
    }).catch(function (err) { buildErr = err.message || 'That photo could not be used. Try another one.'; rerender(); });
  });

  function scheduleArrival() {
    if (!store.waves.sam || store.samArrived) return;
    setTimeout(function () {
      if (store.samArrived) return;
      store.samArrived = true; save();
      toast('Sam Okafor just got a passport.', 'Say hi', 'person-sam');
      if (view.name === 'find' || view.name === 'person') rerender();
    }, 7000);
  }

  scheduleArrival();
  route();
})();
</script>

</body>
</html>
